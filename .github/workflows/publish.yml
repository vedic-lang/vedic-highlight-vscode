name: Publish Vedic to Marketplace

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Extension version to publish (must match package.json)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check release branch and version
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" != refs/heads/main || "$EXPECTED_VERSION" != "$version" ]]; then
            echo "::error::Select main and enter the manifest version ($version)."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: node --check extension.js
      - name: Build extension
        run: ./node_modules/.bin/vsce package --out "$RUNNER_TEMP/vedic.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vedic-vsix
          path: ${{ runner.temp }}/vedic.vsix
          if-no-files-found: error

  publish:
    name: Publish VSIX
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: marketplace
    concurrency: marketplace-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vedic-vsix
          path: ${{ runner.temp }}/release
      - name: Publish with Marketplace Trusted Publishing
        run: ./node_modules/.bin/vsce publish --oidc --packagePath "$RUNNER_TEMP/release/vedic.vsix"
